<style>

#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#08090A;transition:opacity .3s ease;}

#boot-msg{color:#8C8D90;font-size:13px;text-align:center;animation:bootPulse 1.4s ease-in-out infinite;}

@keyframes bootPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
input,select,textarea{font-size:16px !important;}

/* ---- Passwort ---- */
async function hashPw(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function fetchQuote(ticker) {

  } catch {

// Yahoo Finance Symbole für EU/Nicht-US Aktien
const YAHOO_SYMBOLS = {
  "RHM.DE": "RHM.DE",
  RHM: "RHM.DE",

  "02H0": "HTRO.ST",
  IS3Q: "IS3Q.DE",

  QEM: "QNC.V",
  QNC: "QNC.V"
};
const NEEDS_YAHOO = new Set(Object.keys(YAHOO_SYMBOLS));

// Fremdwährungs-Umrechnung in USD (damit alles einheitlich ist – Portfolio rechnet dann in EUR um)
const FX_TO_USD = {
  EUR: 1.08,
  SEK: 0.095,
  CAD: 0.73,
  USD: 1
};
async function fetchYahooQuote(ticker) {
  const symbol = YAHOO_SYMBOLS[ticker];
  if (!symbol) return null;
  try {
    const r = await fetch(`${PROXY_URL}/yahoo`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        symbol
      })
    });
    const d = await r.json();
    if (!d || d.error || !d.price) return null;
    // In USD umrechnen für einheitliche Basis
    const toUsd = FX_TO_USD[d.currency] || 1;
    return {
      price: d.price * toUsd,
      priceOrig: d.price,
      change: d.change,
      prev: d.prev * toUsd,
      currency: d.currency || "EUR"
    };
  } catch {
    return null;
  }
}
async function fetchAllQuotes(extraTickers = []) {
  const results = {};
  const all = [...QUOTE_TICKERS.map(p => p.ticker)];
  extraTickers.forEach(t => {
    if (t && !all.includes(t)) all.push(t);
  });

  // US-Aktien (Finnhub, Rate-Limit) und EU-Aktien (Yahoo, kein Limit) trennen
  const usTickers = all.filter(t => !NEEDS_YAHOO.has(t));
  const euTickers = all.filter(t => NEEDS_YAHOO.has(t));

  // EU-Aktien parallel (Yahoo verträgt das)
  const euPromise = Promise.all(euTickers.map(async ticker => {
    const q = await fetchYahooQuote(ticker);
    if (q) results[ticker] = q;
  }));

  // US-Aktien gestaffelt in Kleingruppen (Finnhub Free = ~30 Anfragen/Sekunde, aber sicher ist sicher)
  const delay = ms => new Promise(r => setTimeout(r, ms));
  for (let i = 0; i < usTickers.length; i += 3) {
    const batch = usTickers.slice(i, i + 3);
    await Promise.all(batch.map(async ticker => {
      let q = await fetchQuote(ticker);
      // Ein Rate-Limit-Retry nach kurzer Pause
      if (!q) {
        await delay(400);
        q = await fetchQuote(ticker);
      }
      if (q) results[ticker] = q;
    }));
    if (i + 3 < usTickers.length) await delay(250);
  }
  await euPromise;
  return results;
}

/* ---- Finnhub: News ---- */
async function fetchNewsForTicker(ticker) {
  const to = new Date().toISOString().split("T")[0];
  const from = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split("T")[0];
  try {
    const r = await fetch(`${PROXY_URL}/finnhub`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        endpoint: "company-news",
        params: {
          symbol: ticker,
          from,
          to
        }
      })
    });
    const d = await r.json();
    return Array.isArray(d) ? d.slice(0, 5).map(n => ({
      ...n,
      ticker
    })) : [];
  } catch {
    return [];
  }
}
async function fetchMarketNews() {
  try {
    const r = await fetch(`${PROXY_URL}/finnhub`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        endpoint: "news",
        params: {
          category: "general"
        }
      })
    });
    const d = await r.json();
    return Array.isArray(d) ? d.slice(0, 10) : [];
  } catch {
    return [];
  }
}
async function fetchAllNews() {
  const [market, ...perStock] = await Promise.all([fetchMarketNews(), ...QUOTE_TICKERS.map(p => fetchNewsForTicker(p.ticker))]);
  const stock = perStock.flat();
  // Duplikate entfernen
  const seen = new Set();
  return [...stock, ...market].filter(n => {
    if (seen.has(n.id || n.headline)) return false;
    seen.add(n.id || n.headline);
    return true;
  }).slice(0, 25);
}

/* ---- KI-Chat mit Portfolio-Kontext ---- */
async function chatWithClaude(userMessage, history, quotes, myPositions, memory, analysis, dailyUpdates) {
  const posContext = myPositions.length > 0 ? "Portfolio des Nutzers: " + myPositions.map(p => {
    const q = quotes[p.ticker];
    return p.ticker + " (" + p.shares + " Stück" + (q ? ", akt. $" + q.price?.toFixed(2) : "") + ")";
  }).join(", ") : "Nutzer hat noch kein Portfolio importiert.";
  const quoteContext = Object.entries(quotes).slice(0, 12).map(([t, q]) => t + " $" + q.price?.toFixed(2) + " (" + (q.change >= 0 ? "+" : "") + q.change?.toFixed(1) + "%)").join(", ");

  // Gedächtnis
  let memText = "";
  if (memory) {
    if (memory.profile) memText += `\n\nWas du über den Nutzer weißt: ${memory.profile}`;
    if (memory.notes?.length) memText += `\nGemerkte Notizen: ${memory.notes.slice(-8).map(n => n.text || n).join("; ")}`;
    if (memory.trades?.length) {
      const recent = memory.trades.slice(-10).map(t => `${t.date} ${t.action} ${t.ticker}${t.shares ? " " + t.shares + "Stk" : ""}${t.price ? " @$" + t.price : ""}`).join("; ");
      memText += `\nTrade-Historie: ${recent}`;
    }
  }
  // Vollständiger Seiten-Kontext: was gerade im KI-Analyse-Widget steht
  let anaText = "";
  if (analysis) {
    if (analysis.briefing) anaText += `\n\nDAS STEHT GERADE IM KI-ANALYSE-WIDGET AUF DER SEITE:\nBriefing: ${analysis.briefing}`;
    if (analysis.watchOut) anaText += `\nWorauf achten (watchOut): ${analysis.watchOut}`;
    if (analysis.opportunities?.length) anaText += `\nChancen: ${analysis.opportunities.map(o => `${o.ticker}${o.name ? " (" + o.name + ")" : ""} [${o.confidence}%]: ${o.reason}`).join(" | ")}`;
    if (analysis.buyRecommendations?.length) anaText += `\nKaufempfehlungen: ${analysis.buyRecommendations.map(r => `${r.ticker} ${r.action}, Einstieg ${r.entryZone}, Ziel ${r.target}, ${r.timeframe}, Risiko ${r.risk} [${r.confidence}%]: ${r.reason}`).join(" | ")}`;
    if (analysis.dayTrading?.length) anaText += `\nDay-Trading-Setups: ${analysis.dayTrading.map(d => `${d.ticker} ${d.setup}, Entry ${d.entry}, Ziel ${d.target}, Stop ${d.stopLoss} [${d.confidence}%]: ${d.reason}`).join(" | ")}`;
    if (analysis.topNews?.length) anaText += `\nTop-News: ${analysis.topNews.map(n => `[${n.ticker || "Markt"}] ${n.headline} (${n.sentiment})`).join(" | ")}`;
  }
  if (!anaText) anaText = "\n\nKI-ANALYSE-WIDGET: Für heute wurde noch keine KI-Analyse erzeugt – der Nutzer muss oben rechts auf ↺ tippen, dann läuft sie. Erkläre ihm das, falls er nach der Analyse fragt.";
  // Archiv der täglichen Updates
  let duText = "";
  if (dailyUpdates && dailyUpdates.length) {
    const recent = [...dailyUpdates].slice(-7).reverse().map(u => `${u.date}: ${u.briefing || ""}${u.watchOut ? " | Achtung: " + u.watchOut : ""}`).join("\n");
    duText = `\n\nARCHIV DER LETZTEN TÄGLICHEN UPDATES (die auch morgens verschickt werden):\n${recent}`;
  }
  const messages = [...history.map(m => ({
    role: m.role,
    content: m.text
  })), {
    role: "user",
    content: userMessage
  }];
  const resp = await fetch(`${PROXY_URL}/claude`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1200,
      system: `Du bist der persönliche KI-Trading-Assistent, der DIREKT IN der App "Trade Sniffer" eingebaut ist. WICHTIG: Der komplette aktuelle Inhalt der App ist dir unten mitgegeben – das Portfolio, die Live-Kurse, der exakte Text aus dem KI-Analyse-Widget (Briefing, Chancen, Kaufempfehlungen, Day-Trading, News) und das Archiv der täglichen Updates. Das IST dein Zugriff auf die App. Behandle diese Angaben als das was der Nutzer gerade auf seinem Bildschirm sieht. Behaupte NIEMALS, du hättest keinen Zugriff auf die App, die Widgets oder die Analyse – du siehst ihren Inhalt direkt hier unten. Wenn der Nutzer etwas fragt das unten nicht steht, sag konkret welche Info fehlt (z.B. dass die KI-Analyse noch nicht ausgeführt wurde), statt pauschal Zugriff zu verneinen. Antworte auf Deutsch, freundlich, konkret und kompakt.\n\n=== AKTUELLER APP-INHALT ===\n${posContext}\n\nAktuelle Kurse: ${quoteContext}${memText}${anaText}${duText}\n=== ENDE APP-INHALT ===\n\nGib niemals Anlageberatung als Garantie aus, aber sei hilfreich und konkret. Der Nutzer akzeptiert die Risiken selbst. Wenn der Nutzer dir etwas Wichtiges über seine Strategie oder Vorlieben mitteilt, kannst du das am Ende deiner Antwort mit [MERKEN: ...] markieren, damit es gespeichert wird.`,
      messages
    })
  });
  const data = await resp.json();
  if (!data.content?.[0]?.text) throw new Error("Keine Antwort");
  return data.content[0].text.trim();
}

/* ---- Vertiefte Einzelaktien-Analyse (KI-Analyse-Widget) ---- */
async function deepenStock(ticker, name, baseReason, quotes, analysis) {
  const q = quotes[ticker];
  const priceStr = q ? `$${q.price?.toFixed(2)} (${q.change >= 0 ? "+" : ""}${q.change?.toFixed(1)}% heute)` : "aktuell nicht verfügbar";
  const briefing = analysis?.briefing ? `\nHeutiges Gesamt-Briefing: ${analysis.briefing}` : "";
  const prompt = `Vertiefe die Einschätzung zu ${ticker}${name ? " (" + name + ")" : ""} für einen deutschen Privatanleger mit Quantencomputing/Verteidigungs-Fokus.
Bisherige Kurz-Einschätzung im Widget: "${baseReason || "—"}".
Aktueller Kurs: ${priceStr}.${briefing}

Gib 3-5 Sätze zusätzlichen Kontext: warum diese Chance bzw. dieses Risiko besteht, welche konkreten Katalysatoren oder Kennzahlen zu beobachten sind, und ein realistischer Blick auf Einstieg und Zeithorizont. Deutsch, konkret, ohne Markdown-Überschrift, keine Garantie-Versprechen.`;
  const resp = await fetch(`${PROXY_URL}/claude`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 700,
      system: "Du bist ein präziser KI-Trading-Assistent. Antworte auf Deutsch in fließenden Sätzen, konkret und ohne Floskeln. Keine Anlageberatung als Garantie.",
      messages: [{
        role: "user",
        content: prompt
      }]
    })
  });
  const data = await resp.json();
  if (!data.content?.[0]?.text) throw new Error("Keine Antwort von Claude");
  return data.content[0].text.trim();
}

async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("Datei konnte nicht gelesen werden"));
    r.readAsDataURL(file);
  });
}
function calcPL(pos, quotes) {
  if (!pos.shares) return null;
  const q = quotes[pos.ticker];
  const price = q?.price || pos.currentPrice || 0;
  if (!price) return null; // kein Kurs verfügbar
  const current = price * pos.shares;
  // P&L nur wenn Kaufpreis vorhanden, sonst nur aktueller Wert
  const hasCost = pos.avgPrice && pos.avgPrice > 0;
  const cost = hasCost ? pos.avgPrice * pos.shares : 0;
  const plAbs = hasCost ? current - cost : null;
  const plPct = hasCost ? (current - cost) / cost * 100 : null;
  return {
    current,
    cost,
    plAbs,
    plPct,
    price,
    isLive: !!q?.price,
    hasCost
  };
}

// Normalisiert Ticker für Duplikat-Erkennung (RHM = RHM.DE, QNC = QNC.V etc.)
function baseTickerKey(ticker) {
  if (!ticker) return "";
  let t = ticker.toUpperCase().trim();
  // Börsen-Suffixe entfernen
  t = t.replace(/\.(DE|F|ST|V|L|IL|PA|MI|SW|VI|HM|TO)$/, "");
  // Revolut-Codes zu Standard mappen
  const revMap = {
    "02H0": "HTRO",
    "0A0T": "IONQ",
    "0KG0": "QBTS",
    "0GTM": "MRAM",
    "0GZF": "AVAV",
    "QEM": "QNC",
    "QNC": "QNC",
    "RHMD": "RHM",
    "IEMS": "IS3Q",
    "INFLQ": "INFQ"
  };
  return revMap[t] || t;
}

// Findet Duplikat-Gruppen im Portfolio
function findDuplicates(positions) {
  const groups = {};
  positions.forEach((p, i) => {
    const key = baseTickerKey(p.ticker);
    if (!groups[key]) groups[key] = [];
    groups[key].push({
      ...p,
      _index: i
    });
  });
  return Object.values(groups).filter(g => g.length > 1);
}

/* ---- Automatische Trade-Erkennung: alt vs. neu vergleichen ---- */
function detectTrades(oldPositions, newPositions) {
  const trades = [];
  const now = new Date().toISOString().slice(0, 10);
  const oldMap = {};
  oldPositions.forEach(p => {
    oldMap[baseTickerKey(p.ticker)] = p;
  });
  const newMap = {};
  newPositions.forEach(p => {
    newMap[baseTickerKey(p.ticker)] = p;
  });

  // Neue oder aufgestockte Positionen = Kauf
  newPositions.forEach(p => {
    const key = baseTickerKey(p.ticker);
    const old = oldMap[key];
    if (!old && p.shares > 0) {
      trades.push({
        date: now,
        ticker: p.ticker,
        name: p.name || "",
        action: "Kauf",
        shares: p.shares,
        price: p.avgPrice || 0,
        note: "neu ins Depot"
      });
    } else if (old && p.shares > old.shares + 0.001) {
      trades.push({
        date: now,
        ticker: p.ticker,
        name: p.name || "",
        action: "Aufstockung",
        shares: +(p.shares - old.shares).toFixed(4),
        price: p.avgPrice || 0,
        note: "nachgekauft"
      });
    }
  });
  // Verkaufte oder reduzierte Positionen = Verkauf
  oldPositions.forEach(p => {
    const key = baseTickerKey(p.ticker);
    const cur = newMap[key];
    if (!cur && p.shares > 0) {
      trades.push({
        date: now,
        ticker: p.ticker,
        name: p.name || "",
        action: "Verkauf",
        shares: p.shares,
        price: 0,
        note: "komplett verkauft"
      });
    } else if (cur && cur.shares < p.shares - 0.001) {
      trades.push({
        date: now,
        ticker: p.ticker,
        name: p.name || "",
        action: "Teilverkauf",
        shares: +(p.shares - cur.shares).toFixed(4),
        price: 0,
        note: "teilweise verkauft"
      });
    }
  });
  return trades;
}

function App() {

    let live = true;
    (async () => {
      try {
        const h = await dbGet("hash");
        if (!live) return;
        if (h) {
          setHash(h);
          setScreen("login");
        } else {
          setScreen("setup");
        }
      } catch (e) {
        if (live) {
          setOk(false);
          setScreen("setup");
        }
      }
    })();
    return () => {
      live = false;
    };
  }, []);

    const h = await hashPw(pw);
    await dbSet("hash", h);
    setHash(h);
    setScreen("dashboard");
  }

    const h = await hashPw(pw);
    if (h !== hash) throw new Error("falsch");
    setScreen("dashboard");

    .wlib-btn{background:#222426;border:1px solid #3FC6C2;color:#3FC6C2;border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;transition:background .15s;}
    .wlib-btn:hover{background:#1A2A2A;}
    .wlib-icon{font-size:14px;}
    /* Chart-Widget */
    .wchart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
    .wchart-ticker{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#3FC6C2;}
    .wchart-price{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:#ECEAE5;margin-top:2px;}
    .wchart-chg{font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;}
    .wchart-chg.pos{background:rgba(95,174,124,.15);color:#5FAE7C;}
    .wchart-chg.neg{background:rgba(201,105,90,.15);color:#C9695A;}
    .wchart-spark{flex:1;min-height:44px;margin-top:8px;display:flex;align-items:flex-end;}
    /* Platzhalter-Widget */
    .wspacer{width:100%;height:100%;min-height:60px;border:1.5px dashed #323436;border-radius:10px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(50,52,54,.15) 6px,rgba(50,52,54,.15) 7px);}
    .wspacer-dot{color:#4A4C4E;font-size:24px;font-weight:300;}
    .wspacer-title{color:#8C8D90;font-size:13px;font-weight:500;}
    /* Config-Popup */
    .cfg-pop{padding:12px !important;min-width:180px;}
    .cfg-label{font-size:11px;color:#8C8D90;margin:0 0 6px;}
    /* Hamburger-Menü Panel */

    .menu-panel{width:100%;max-width:420px;height:100%;background:#131414;border-left:1px solid #323436;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);animation:menuSlide .25s ease;}
    @keyframes menuSlide{from{transform:translateX(100%);}to{transform:translateX(0);}}
    .menu-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #323436;flex-shrink:0;}
    .menu-title{font-family:'Fraunces',serif;font-size:18px;color:#3FC6C2;}
    .menu-profile{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #323436;flex-shrink:0;}
    .menu-profile-icon{width:44px;height:44px;border-radius:50%;background:#222426;color:#3FC6C2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    /* KI-Gedächtnis im Menü */
    .menu-memory{padding:14px 20px;border-bottom:1px solid #323436;flex-shrink:0;}
    .mem-details{margin-top:10px;}
    .mem-details summary{font-size:12px;color:#3FC6C2;cursor:pointer;padding:4px 0;}
    .mem-list{display:flex;flex-direction:column;gap:5px;margin-top:8px;max-height:140px;overflow-y:auto;}
    .mem-item{font-size:12px;color:#ECEAE5;display:flex;align-items:center;gap:6px;background:#1A1B1D;border-radius:6px;padding:5px 8px;}
    .mem-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0;}
    .mem-tag.buy{background:rgba(95,174,124,.2);color:#5FAE7C;}
    .mem-tag.sell{background:rgba(201,105,90,.2);color:#C9695A;}
    .mem-tag.note{background:rgba(63,198,194,.2);color:#3FC6C2;}
    /* KI-Chat: füllt Rest, aber Messages scrollen intern */
    .menu-chat{flex:1;display:flex;flex-direction:column;min-height:0;padding:16px 20px 0;}
    .menu-chat-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#ECEAE5;margin-bottom:12px;flex-shrink:0;}
    .menu-chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px;-webkit-overflow-scrolling:touch;}
    .chat-empty{color:#8C8D90;font-size:13px;line-height:1.5;text-align:center;padding:24px 12px;}
    .chat-msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;word-wrap:break-word;}
    .chat-msg.user{align-self:flex-end;background:#3FC6C2;color:#082422;border-bottom-right-radius:4px;}
    .chat-msg.assistant{align-self:flex-start;background:#222426;color:#ECEAE5;border-bottom-left-radius:4px;}
    .chat-typing{color:#8C8D90;letter-spacing:2px;}
    .menu-chat-input{display:flex;gap:8px;padding:12px 0 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));border-top:1px solid #323436;flex-shrink:0;}
    .menu-chat-input .ai{flex:1;margin:0;}
    .chat-send{width:44px;height:44px;flex-shrink:0;background:#3FC6C2;color:#082422;border:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .chat-send:disabled{background:#323436;color:#8C8D90;cursor:default;}
    /* Preisalarm */
    .alert-banner{display:flex;align-items:center;gap:10px;margin:0 22px 4px;padding:12px 16px;background:linear-gradient(90deg,rgba(95,174,124,.18),rgba(63,198,194,.12));border:1px solid #5FAE7C;border-radius:12px;color:#5FAE7C;font-size:13px;font-weight:500;animation:alertPulse 2s ease-in-out infinite;}
    @keyframes alertPulse{0%,100%{border-color:#5FAE7C;}50%{border-color:rgba(95,174,124,.4);}}
    .alert-hit-list{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
    .alert-hit{display:flex;align-items:center;gap:8px;background:rgba(95,174,124,.12);border-radius:6px;padding:5px 8px;}
    /* Schnüffel-Ladeanimation */
    .sniffer-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
    .sniffer-scene{position:relative;display:flex;flex-direction:column;align-items:center;}
    .sniffer-img{transform-origin:75% 90%;animation:sniff 1.4s ease-in-out infinite;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
    .sniffer-shadow{width:70%;height:8px;background:radial-gradient(ellipse,rgba(63,198,194,.25),transparent 70%);border-radius:50%;margin-top:2px;animation:sniffShadow 1.4s ease-in-out infinite;}
    .sniffer-label{font-size:13px;color:#8C8D90;letter-spacing:.02em;animation:sniffPulse 1.4s ease-in-out infinite;}
    @keyframes sniff{
      0%,100%{transform:rotate(-7deg) translateX(-3px);}
      25%{transform:rotate(-2deg) translateX(1px);}
      50%{transform:rotate(6deg) translateX(3px);}
      75%{transform:rotate(-2deg) translateX(1px);}
    }
    @keyframes sniffShadow{
      0%,100%{transform:translateX(-6px) scaleX(.9);opacity:.6;}
      50%{transform:translateX(6px) scaleX(1.1);opacity:.9;}
    }
    @keyframes sniffPulse{0%,100%{opacity:.5;}50%{opacity:1;}}
    /* Mini-Schnüffler (klein, im Widget-Header statt Spinner) */
    .sniffer-mini{height:22px;width:auto;transform-origin:75% 90%;animation:sniff 1.3s ease-in-out infinite;flex-shrink:0;}

    .pm-hint{font-size:13px;color:#8C8D90;line-height:1.5;margin:0 0 12px;}

    .pm-file-label{background:#222426;border:2px dashed #323436;color:#3FC6C2;padding:20px;border-radius:12px;text-align:center;font-size:14px;cursor:pointer;transition:border-color .15s;}
    .pm-file-label:hover{border-color:#3FC6C2;}
    .pm-back{background:none;border:none;color:#8C8D90;font-size:13px;cursor:pointer;padding:4px 0;font-family:'Inter',sans-serif;}
    .pm-preview-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
    .pm-preview-row{display:flex;align-items:center;gap:10px;background:#222426;border-radius:8px;padding:8px 12px;}
    .pm-pname{font-size:12px;color:#8C8D90;flex:1;}
    .pm-pshares{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#ECEAE5;}
    .pm-pavg{font-size:11px;color:#8C8D90;font-family:'IBM Plex Mono',monospace;}
    .pm-preview-actions{display:flex;gap:10px;align-items:center;}
    .pm-edit-form{display:flex;flex-direction:column;gap:4px;}
    .pm-total-row{display:flex;align-items:center;justify-content:space-between;background:#222426;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13px;font-weight:600;}
    .pm-positions{display:flex;flex-direction:column;gap:6px;}
    .pm-pos-row{display:flex;align-items:center;gap:10px;background:#222426;border-radius:8px;padding:8px 12px;}
    .pm-pcurrent{font-size:12px;font-family:'IBM Plex Mono',monospace;color:#ECEAE5;margin-left:auto;}
    .pm-icon-btn{background:#1A1B1D;border:1px solid #323436;color:#8C8D90;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
    .pm-icon-btn.del:hover{border-color:#C9695A;color:#C9695A;}
    .pm-icon-btn:hover{border-color:#3FC6C2;color:#3FC6C2;}
    /* Kaufempfehlungen */
    .rec-card{background:#222426;border:1px solid #323436;border-radius:10px;padding:10px 12px;margin-bottom:2px;}
    .rec-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
    .rec-action{font-size:11px;font-weight:700;color:#5FAE7C;background:rgba(95,174,124,.15);padding:2px 7px;border-radius:5px;}
    .rec-meta{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:3px;flex-wrap:wrap;}
    .rec-entry{color:#8C8D90;font-family:'IBM Plex Mono',monospace;}
    .rec-sep{color:#323436;}
    .rec-target{color:#5FAE7C;font-family:'IBM Plex Mono',monospace;font-weight:600;}
    .rec-timeframe{font-size:10px;color:#8C8D90;margin:2px 0 5px;}
    .rec-risk{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;}
    .risk-niedrig{background:rgba(95,174,124,.2);color:#5FAE7C;}
    .risk-mittel{background:rgba(201,160,77,.2);color:#C9A04D;}
    .risk-hoch{background:rgba(201,105,90,.2);color:#C9695A;}
    /* Day Trading */
    .dt-card{background:#222426;border:1px solid #323436;border-radius:10px;padding:10px 12px;margin-bottom:2px;}
    .dt-setup{font-size:11px;color:#3FC6C2;font-weight:600;}
    .dt-levels{display:flex;gap:10px;margin:6px 0 4px;flex-wrap:wrap;}
    .dt-level{display:flex;flex-direction:column;align-items:center;background:#1A1B1D;border-radius:6px;padding:4px 8px;min-width:60px;}
    .dt-lab{font-size:9px;color:#8C8D90;text-transform:uppercase;letter-spacing:.05em;}
    .dt-val{font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#ECEAE5;}
    .dt-val.pos{color:#5FAE7C;}.dt-val.neg{color:#C9695A;}
